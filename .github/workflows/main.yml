name: Get Weather Info

on:
  workflow_dispatch: # Chạy thủ công

jobs:
  run-weather-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cài đặt các thư viện cần thiết
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Chạy script thời tiết
        env:
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }} # Truyền Secret vào code
        run: python main.py
